_templates_suffix: .jinja

_exclude:
  - ".git"
  - ".git/**"
  - ".DS_Store"
  - ".copierignore"
  - "copier.yml"
  - "CONTEXT.md"
  - "README.md"
  - "repo-template.code-workspace"
  - "_claude_content.md"

use_python:
  type: bool
  default: false
  help: "Python の利用有無"

python_version:
  type: str
  default: "3.14"
  when: "{{ use_python }}"
  help: "Python バージョン"

use_chrome_extension:
  type: bool
  default: false
  help: "Chrome Extension の利用有無"

node_version:
  type: str
  default: "24"
  when: "{{ use_chrome_extension }}"
  help: "Node.js バージョン"

chrome_extension_name:
  type: str
  default: "Test Extension"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension 名"

chrome_extension_description:
  type: str
  default: "Test Chrome Extension"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension の説明"

chrome_extension_version:
  type: str
  default: "0.1.0"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension バージョン"

use_docker:
  type: bool
  default: false
  help: "Docker の利用有無"

use_gh_actions_docker_release:
  type: bool
  default: false
  when: "{{ use_docker }}"
  help: ".github/workflows/docker-release.yml を生成"

use_gh_actions_release:
  type: bool
  default: false
  when: "{{ not use_gh_actions_docker_release }}"
  help: ".github/workflows/release.yml を生成（docker-release 無効時のみ）"

use_aws_ecr:
  type: bool
  default: false
  when: "{{ use_docker }}"
  help: "AWS ECR を利用"

aws_account_id:
  type: str
  default: "0000000000"
  when: "{{ use_aws_ecr }}"
  help: "AWS アカウント ID"

aws_region:
  type: str
  default: "us-east-1"
  when: "{{ use_aws_ecr }}"
  help: "AWS リージョン"

docker_registry:
  type: str
  default: "docker"
  when: "{{ use_docker }}"
  help: "Docker レジストリ"

docker_image_name:
  type: str
  default: "test"
  when: "{{ use_docker }}"
  help: "Docker イメージ名"

use_gh_actions_pr_tag_check:
  type: bool
  default: false
  help: ".github/workflows/pr-tag-check.yml を生成"

use_mit_license:
  type: bool
  default: false
  help: "LICENSE を生成"

author_name:
  type: str
  default: "みず"
  help: "作者名"

author_email:
  type: str
  default: "mizu.copo@gmail.com"
  when: "{{ use_python }}"
  help: "メールアドレス"
