_templates_suffix: .jinja

_exclude:
  - ".git"
  - ".git/**"
  - ".DS_Store"
  - ".copierignore"
  - "copier.yml"
  - "CONTEXT.md"
  - "README.md"
  - "docs/adr"
  - "docs/adr/**"
  - "repo-template.code-workspace"
  - "template_tests"
  - "template_tests/**"
  - ".github/workflows/template-quality-checks.yml"
  - "_claude_content.md"
  - "_release_state_reader.sh"
  - "_release_version_reader.sh"
  # Existing and intentionally deleted starter files belong to the generated project.
  - "{% if repo_template_python_application_starter_created | default(false) %}src/__init__.py{% endif %}"
  - "{% if (python_package_name | default('')) in (repo_template_python_package_starter_names | default([])) %}src/*/__init__.py{% endif %}"
  - "{% if repo_template_python_starters_created | default(false) %}stubs/__init__.py{% endif %}"
  - "{% if repo_template_python_starters_created | default(false) %}tests/__init__.py{% endif %}"
  - "{% if repo_template_rust_starters_created | default(false) %}src/main.rs{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}src/background.ts{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}src/lib/extension-title.ts{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}src/popup.css{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}src/popup.html{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}src/popup.ts{% endif %}"
  - "{% if repo_template_chrome_starters_created | default(false) %}tests/lib/extension-title.test.ts{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}index.html{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}src/lib/greeting.ts{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}src/main.ts{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}src/styles.css{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}tests/lib/greeting.test.ts{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}src-tauri/src/lib.rs{% endif %}"
  - "{% if repo_template_tauri_starters_created | default(false) %}src-tauri/icons/**{% endif %}"

_skip_if_exists:
  - "src/__init__.py"
  - "src/*/__init__.py"
  - "stubs/__init__.py"
  - "tests/__init__.py"
  - "src/main.rs"
  - "src/background.ts"
  - "src/lib/extension-title.ts"
  - "src/popup.css"
  - "src/popup.html"
  - "src/popup.ts"
  - "tests/lib/extension-title.test.ts"
  - "index.html"
  - "src/lib/greeting.ts"
  - "src/main.ts"
  - "src/styles.css"
  - "tests/lib/greeting.test.ts"
  - "src-tauri/src/lib.rs"
  - "src-tauri/icons/**"

project_name:
  type: str
  default: "test-project"
  help: "配布物・packageに使うproject名（kebab-case）"
  validator: >-
    {% if project_name | length > 64 %}
    project名は64文字以内で入力してください。
    {% elif not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    project名は小文字の英字から始まるkebab-caseで入力してください。
    {% endif %}

project_description:
  type: str
  default: "Test Project"
  help: "projectの説明"

project_version:
  type: str
  default: "0.1.0"
  help: "projectの初期version（SemVer）"
  validator: >-
    {% if not (project_version | regex_search('^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')) %}
    project versionはプレリリースを含まないSemVer形式で入力してください。
    {% endif %}

use_python:
  type: bool
  default: false
  help: "Python の利用有無"

python_version:
  type: str
  default: "3.14"
  when: "{{ use_python }}"
  help: "Python バージョン"

python_project_kind:
  type: str
  default: "application"
  when: "{{ use_python }}"
  choices:
    - application
    - package
    - library
  help: "Python projectの種類（applicationはsrc直下、package/libraryはimport packageを生成）"

python_package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: "{{ use_python and python_project_kind != 'application' }}"
  help: "Python import package名（snake_case）"
  validator: >-
    {% set python_keywords = [
      'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue',
      'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from',
      'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not',
      'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'
    ] %}
    {% if not (python_package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Python import package名は小文字の英字から始まるsnake_caseで入力してください。
    {% elif python_package_name in python_keywords %}
    Python import package名にはPython予約語を使用できません。
    {% endif %}

use_rust:
  type: bool
  default: false
  help: "Rust の利用有無"

use_chrome_extension:
  type: bool
  default: false
  help: "Chrome Extension の利用有無"

use_tauri:
  type: bool
  default: false
  help: "Tauri の利用有無"
  validator: >-
    {% if use_tauri and use_rust %}
    Tauri は専用の src-tauri Cargo プロジェクトを生成するため、use_rust と同時には利用できません。
    {% elif use_tauri and use_chrome_extension %}
    Tauri と Chrome Extension は package.json と src/ を共有するため、同時には利用できません。
    {% endif %}

rust_version:
  type: str
  default: "stable"
  when: "{{ use_rust or use_tauri }}"
  help: "Rust ツールチェーン"
  validator: >-
    {% set named_channel = '(stable|beta|nightly)' %}
    {% set rust_1_85_or_newer = '1\\.(8[5-9]|9[0-9]|[1-9][0-9]{2,})(\\.[0-9]+)?' %}
    {% set rust_2_or_newer = '[2-9][0-9]*\\.[0-9]+(\\.[0-9]+)?' %}
    {% set pattern = '^(' ~ named_channel ~ '|' ~ rust_1_85_or_newer ~ '|' ~ rust_2_or_newer ~ ')$' %}
    {% if not (rust_version | regex_search(pattern)) %}
    Rust ツールチェーンは stable/beta/nightly または 1.85 以上のバージョンを入力してください。
    {% endif %}

node_version:
  type: str
  default: "24"
  when: "{{ use_chrome_extension or use_tauri }}"
  help: "Node.js バージョン"

chrome_extension_name:
  type: str
  default: "Test Extension"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension 名"

chrome_extension_description:
  type: str
  default: "Test Chrome Extension"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension の説明"

chrome_extension_version:
  type: str
  default: "{{ project_version }}"
  when: "{{ use_chrome_extension }}"
  help: "Chrome Extension バージョン"
  validator: >-
    {% set segment = '(0|[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])' %}
    {% set pattern = '^(?!0(?:\\.0){0,3}$)' ~ segment ~ '(\\.' ~ segment ~ '){0,3}$' %}
    {% if not (chrome_extension_version | regex_search(pattern)) %}
    Chrome Extension バージョンは Chrome manifest version 形式（1〜4個のドット区切り整数、各要素は 0〜65535）で入力してください。
    {% endif %}

tauri_package_name:
  type: str
  default: "test-tauri-app"
  when: "{{ use_tauri }}"
  help: "Tauri package 名"
  validator: >-
    {% if tauri_package_name | length > 64 %}
    Tauri package 名は64文字以内で入力してください。
    {% elif not (tauri_package_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Tauri package 名は小文字の英字から始まる kebab-case で入力してください。
    {% endif %}

tauri_product_name:
  type: str
  default: "Test Tauri App"
  when: "{{ use_tauri }}"
  help: "Tauri アプリ名"
  validator: >-
    {% if tauri_product_name | regex_search('[/\\\\:*?"<>|]') %}
    Tauri アプリ名には / \ : * ? " < > | を含められません。
    {% endif %}

tauri_identifier:
  type: str
  default: "com.example.test"
  when: "{{ use_tauri }}"
  help: "Tauri アプリ識別子"
  validator: >-
    {% set identifier_part = '[A-Za-z0-9][A-Za-z0-9-]*' %}
    {% set pattern = '^' ~ identifier_part ~ '(\\.' ~ identifier_part ~ '){1,}$' %}
    {% if not (tauri_identifier | regex_search(pattern)) %}
    Tauri アプリ識別子は com.example.app のような逆ドメイン形式で入力してください。
    {% endif %}

tauri_version:
  type: str
  default: "{{ project_version }}"
  when: "{{ use_tauri }}"
  help: "Tauri アプリバージョン"
  validator: >-
    {% set numeric_identifier = '(0|[1-9][0-9]*)' %}
    {% set non_numeric_identifier = '[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*' %}
    {% set prerelease_identifier = '(' ~ numeric_identifier ~ '|' ~ non_numeric_identifier ~ ')' %}
    {% set build_identifier = '[0-9A-Za-z-]+' %}
    {% set core = numeric_identifier ~ '\\.' ~ numeric_identifier ~ '\\.' ~ numeric_identifier %}
    {% set prerelease = '(-' ~ prerelease_identifier ~ '(\\.' ~ prerelease_identifier ~ ')*)?' %}
    {% set build = '(\\+' ~ build_identifier ~ '(\\.' ~ build_identifier ~ ')*)?' %}
    {% set semver = '^' ~ core ~ prerelease ~ build ~ '$' %}
    {% if not (tauri_version | regex_search(semver)) %}
    Tauri アプリバージョンは 0.1.0 のような SemVer 形式で入力してください。
    {% endif %}

use_docker:
  type: bool
  default: false
  help: "Docker の利用有無"

use_dependabot_docker:
  type: bool
  default: true
  when: "{{ use_docker }}"
  help: "Dependabot で Docker image の更新を監視"

use_gh_actions_docker_release:
  type: bool
  default: false
  when: "{{ use_docker }}"
  help: ".github/workflows/docker-release.yml を生成"

use_gh_actions_docker_quality:
  type: bool
  default: false
  when: "{{ use_docker }}"
  help: ".github/workflows/docker-quality-checks.yml を生成"

dockerfile_path:
  type: str
  default: "Dockerfile"
  when: "{{ use_gh_actions_docker_quality }}"
  help: "Docker quality workflowでbuildするDockerfile"
  validator: >-
    {% set normalized_path = dockerfile_path | replace("\\", "/") %}
    {% if not dockerfile_path or normalized_path | regex_search('(^/|^[A-Za-z]:/|(^|/)\.\.(/|$))') %}
    Dockerfile pathはrepository rootからの相対pathを入力してください。
    {% endif %}

docker_build_context:
  type: str
  default: "."
  when: "{{ use_gh_actions_docker_quality }}"
  help: "Docker quality workflowのbuild context"
  validator: >-
    {% set normalized_context = docker_build_context | replace("\\", "/") %}
    {% if not docker_build_context or normalized_context | regex_search('(^/|^[A-Za-z]:/|(^|/)\.\.(/|$))') %}
    Docker build contextはrepository rootからの相対pathを入力してください。
    {% endif %}

docker_smoke_command:
  type: str
  default: ""
  when: "{{ use_gh_actions_docker_quality }}"
  help: "build後にcontainer内で実行する最小smoke command（不要なら空）"

use_gh_actions_release:
  type: bool
  default: false
  when: "{{ not use_gh_actions_docker_release }}"
  help: ".github/workflows/release.yml を生成（docker-release 無効時のみ）"

use_gh_actions_chrome_extension_release:
  type: bool
  default: false
  when: "{{ use_chrome_extension }}"
  help: ".github/workflows/chrome-extension-release.yml を生成"
  validator: >-
    {% if use_gh_actions_chrome_extension_release and (use_gh_actions_release or use_gh_actions_docker_release) %}
    Chrome Extension配布release workflowは use_gh_actions_release / use_gh_actions_docker_release と同時に有効化できません。
    {% endif %}

chrome_extension_release_package_root_directory:
  type: str
  default: "."
  when: "{{ use_gh_actions_chrome_extension_release }}"
  help: "Chrome Extension 配布 release workflow の package root directory"
  validator: >-
    {% set normalized_package_root = chrome_extension_release_package_root_directory | replace("\\", "/") %}
    {% if not chrome_extension_release_package_root_directory %}
    Chrome Extension release package root directory を入力してください。
    {% elif normalized_package_root | regex_search('(^/|^[A-Za-z]:/|(^|/)\\.\\.(/|$))') %}
    Chrome Extension release package root directory は repository root からの相対 path を入力してください。
    {% endif %}

chrome_extension_release_zip_name:
  type: str
  default: "chrome-extension-{version}.zip"
  when: "{{ use_gh_actions_chrome_extension_release }}"
  help: "Chrome Extension 配布 zip 名（{version} を version に置換）"
  validator: >-
    {% if not chrome_extension_release_zip_name %}
    Chrome Extension 配布 zip 名を入力してください。
    {% elif chrome_extension_release_zip_name | regex_search('[/\\\\]') %}
    Chrome Extension 配布 zip 名には path separator を含められません。
    {% elif chrome_extension_release_zip_name | regex_search('#') %}
    Chrome Extension 配布 zip 名には # を含められません。
    {% elif not (chrome_extension_release_zip_name | regex_search('\\.zip$')) %}
    Chrome Extension 配布 zip 名は .zip で終わる名前を入力してください。
    {% endif %}

chrome_extension_release_title:
  type: str
  default: "Chrome Extension {version}"
  when: "{{ use_gh_actions_chrome_extension_release }}"
  help: "Chrome Extension GitHub Release title（{version} を version に置換）"
  validator: >-
    {% if not chrome_extension_release_title %}
    Chrome Extension GitHub Release title を入力してください。
    {% endif %}

chrome_extension_release_notes:
  type: str
  default: "Chrome Extension distribution package for {version}."
  when: "{{ use_gh_actions_chrome_extension_release }}"
  help: "Chrome Extension GitHub Release notes（{version} を version に置換）"
  validator: >-
    {% if not chrome_extension_release_notes %}
    Chrome Extension GitHub Release notes を入力してください。
    {% endif %}

use_aws_ecr:
  type: bool
  default: false
  when: "{{ use_docker }}"
  help: "AWS ECR を利用"

aws_account_id:
  type: str
  default: "0000000000"
  when: "{{ use_aws_ecr }}"
  help: "AWS アカウント ID"

aws_region:
  type: str
  default: "us-east-1"
  when: "{{ use_aws_ecr }}"
  help: "AWS リージョン"

docker_registry:
  type: str
  default: "docker"
  when: "{{ use_docker }}"
  help: "{% if use_aws_ecr %}ECR registry host{% else %}Docker Hub image namespace{% endif %}"

docker_login_username:
  type: str
  default: "{{ docker_registry }}"
  when: "{{ use_gh_actions_docker_release and not use_aws_ecr }}"
  help: "Docker Hub login username"

docker_image_name:
  type: str
  default: "test"
  when: "{{ use_docker }}"
  help: "Docker イメージ名"

use_gh_actions_pr_tag_check:
  type: bool
  default: false
  help: ".github/workflows/pr-tag-check.yml を生成"

use_dependabot_github_actions:
  type: bool
  default: "{{ use_python or use_rust or use_chrome_extension or use_tauri or use_gh_actions_docker_quality or use_gh_actions_docker_release or use_gh_actions_release or use_gh_actions_chrome_extension_release or use_gh_actions_pr_tag_check }}"
  help: "Dependabot で GitHub Actions の更新を監視"

use_mit_license:
  type: bool
  default: false
  help: "LICENSE を生成"

author_name:
  type: str
  default: "みず"
  help: "作者名"

author_email:
  type: str
  default: "mizu.copo@gmail.com"
  help: "メールアドレス"
