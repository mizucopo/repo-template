name: Template Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  template-quality-checks:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install Copier
        run: uv pip install --system copier==9.17.1
      - name: Install actionlint for generated workflow checks
        run: brew install actionlint
      - name: Run template tests
        run: python -m unittest discover -s template_tests -p 'test_*.py'
      - name: Export generated Rust distribution fixture
        run: python template_tests/rust_release_smoke.py --export "$RUNNER_TEMP/rust-release-fixture"
      - name: Retain generated native fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-release-fixture
          path: ${{ runner.temp }}/rust-release-fixture
          include-hidden-files: true
          if-no-files-found: error

  rust-release-smoke:
    needs: template-quality-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download generated native fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-release-fixture
          path: ${{ runner.temp }}/rust-release-fixture
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build, extract and start native executables
        working-directory: ${{ runner.temp }}/rust-release-fixture
        env:
          RUST_RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: python rust_release_smoke.py --target "$RUST_RELEASE_TARGET"
