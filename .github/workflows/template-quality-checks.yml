name: Template Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  template-quality-checks:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install Python template test tools
        run: uv pip install --system copier==9.17.1 bandit==1.9.4
      - name: Set up Go for actionlint
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install actionlint for generated workflow checks
        run: |
          bash .github/scripts/install-actionlint.sh "$RUNNER_TEMP/workflow-tools"
          printf '%s\n' "$RUNNER_TEMP/workflow-tools" >> "$GITHUB_PATH"
      - name: Install cargo-audit for offline regression tests
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/security-tools"
      - name: Run template tests
        env:
          CARGO_AUDIT: ${{ runner.temp }}/security-tools/bin/cargo-audit
        run: python -m unittest discover -s template_tests -p 'test_*.py'
      - name: Export generated Rust distribution fixture
        run: python template_tests/rust_release_smoke.py --export "$RUNNER_TEMP/rust-release-fixture"
      - name: Retain generated native fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-fixture
          path: ${{ runner.temp }}/rust-release-fixture
          include-hidden-files: true
          if-no-files-found: error

  rust-release-smoke:
    needs: template-quality-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download generated native fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-release-fixture
          path: ${{ runner.temp }}/rust-release-fixture
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build, extract and start native executables
        working-directory: ${{ runner.temp }}/rust-release-fixture
        env:
          RUST_RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: python rust_release_smoke.py --target "$RUST_RELEASE_TARGET"
